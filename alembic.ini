[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# L'URL de connexion n'est PAS ici : elle est lue depuis la configuration
# applicative (app.core.config.get_settings().database_url, elle-même issue
# de DATABASE_URL / .env) dans alembic/env.py. Une seule source de vérité
# pour la chaîne de connexion, partagée avec le reste du backend.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
